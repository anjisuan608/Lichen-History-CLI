plugins {
    alias(libs.plugins.shadow)
}

base {
    archivesName = 'historycli-velocity'
}

configurations {
    shade
    implementation.extendsFrom shade
}

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'com.velocitypowered:velocity-api:' + libs.versions.velocityApi.get()
    annotationProcessor 'com.velocitypowered:velocity-api:' + libs.versions.velocityApi.get()
    shade project(':common')
}

processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('velocity-plugin.json') {
        expand 'version': version
    }
}

shadowJar {
    configurations = [project.configurations.shade]
    archiveClassifier = ''
    dependencies {
        include(dependency('org.anjisuan608.historycli:.*'))
    }
}

build.dependsOn shadowJar
