# 语言设置（放在最前面）：不跟随游戏语言，由此处指定。
# 可选：en_us / zh_cn / zh_hk / zh_tw
language: en_us

# 是否记录命令到本 mod 自持的历史日志
record_history: true

# 是否记录「会被转发到后端服务器」的命令（如 /time set day）。
# 默认 false：代理历史只记录发给代理本身的命令（/server、/glist 等）。
# 注意：BungeeCord 控制台命令本就无法入史（平台无事件钩子）。
record_forwarded_commands: false

# 历史上限（条）。0 = 不限（长时间运行的代理请注意内存/文件增长）
history_size: 500
