plugins {
    alias(libs.plugins.shadow)
}

base {
    archivesName = 'historycli-bungee'
}

configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    compileOnly('net.md-5:bungeecord-api:' + libs.versions.bungeeApi.get()) {
        exclude(module: 'bungeecord-protocol')
    }
    shade project(':common')
}

processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('plugin.yml') {
        expand 'version': version
    }
    from(rootProject.file('lang'))
    // LGPL-3.0 §4 要求二进制随附许可证文本
    from(rootProject.file('LICENSE'))
}

// 每个模块只发布 shadowJar 一份产物：普通 jar 与 shadowJar 的默认文件名相同，
// 谁后执行谁覆盖，可能导致发布出缺少 common 的空壳 jar。这里直接禁用普通 jar，
// 让 build/libs 里只留下一个可发布的 jar。
jar {
    enabled = false
}

shadowJar {
    configurations = [project.configurations.shade]
    archiveClassifier = ''
    dependencies {
        include(dependency('org.anjisuan608.historycli:.*'))
    }
}

build.dependsOn shadowJar
