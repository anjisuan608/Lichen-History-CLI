plugins {
    alias(libs.plugins.loom)
}

base {
    archivesName = 'historycli-fabric'
}

tasks.withType(JavaCompile).configureEach {
    // Minecraft 26.2 的类文件是 Java 25（major 69），必须用 25 编译
    options.release = 25
}

loom {
    splitEnvironmentSourceSets()
    // 注意：不要加 loom.mixin { } 块——Loom 1.17 已默认关闭 Mixin AP，配了只会报弃用提示
    //（"The mixin annotation is no longer enabled by default..."）。也**不需要** refmap：
    // 生产环境（intermediary）实测由 Fabric Loader 的 Mixin 0.17.x 运行时重映射，
    // 三个 *.mixins.json 里也不写 "refmap" 键，否则会刷 Reference map could not be read 的警告。
    mods {
        "${rootProject.ext.modId}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        client {
            runDir("run/Client")
        }
        server {
            runDir("run/Server")
        }
    }
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

configurations {
    jarInJar
    implementation.extendsFrom jarInJar
}

loom.nestJars(tasks.named("jar"), configurations.jarInJar)

dependencies {
    // 用 Fabric 的最低支持版本编译（26.1.2），而非全局的 minecraft_version（26.2，
    // 那个同时被 forge 用作构件坐标）。见 gradle.properties 里 minecraft_version_fabric 的注释。
    minecraft "com.mojang:minecraft:${rootProject.ext.minecraftVersionFabric}"
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    jarInJar project(':common')
    implementation project(':common')
    compileOnly 'com.terraformersmc:modmenu:20.0.1'
}

processResources {
    def version = project.version
    inputs.property 'version', version
    inputs.property 'mod_id', rootProject.ext.modId
    inputs.property 'mod_name', rootProject.ext.modName
    inputs.property 'mod_license', rootProject.mod_license
    inputs.property 'fabric_loader_version_min', rootProject.fabric_loader_version_min
    inputs.property 'minecraft_version_range_fabric', rootProject.minecraft_version_range_fabric
    filesMatching('fabric.mod.json') {
        expand 'version': version, 'mod_id': rootProject.ext.modId, 'mod_name': rootProject.ext.modName,
                'mod_license': rootProject.mod_license, 'mod_authors': rootProject.mod_authors,
                'fabric_loader_version_min': rootProject.fabric_loader_version_min,
                'minecraft_version_range': rootProject.minecraft_version_range_fabric
    }
    from(rootProject.file('icon')) {
        into('assets/' + rootProject.ext.modId)
        // icon/README.md 是许可说明，不该被打进产物
        exclude 'README.md'
    }
    from(rootProject.file('lang')) {
        into('assets/' + rootProject.ext.modId + '/lang')
    }
    // LGPL-3.0 §4 要求二进制随附许可证文本
    from(rootProject.file('LICENSE'))
}
