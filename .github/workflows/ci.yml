name: Build

on:
  push:
    branches: [ 'main' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: bash ./gradlew build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: historycli-jars
          # 一个 jar 都没产出时必须让 CI 失败，否则会静默发布空 release
          if-no-files-found: error
          path: |
            fabric/build/libs/historycli-fabric-*.jar
            neoforge/build/libs/historycli-neoforge-*.jar
            forge/build/libs/historycli-forge-*.jar
            bukkit/build/libs/historycli-bukkit-*.jar
            paper/build/libs/historycli-paper-*.jar
            velocity/build/libs/historycli-velocity-*.jar
            bungee/build/libs/historycli-bungee-*.jar

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/test'
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: historycli-jars
          path: jars

      - name: Extract version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_ENV"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lichen History CLI ${{ env.version }}
          draft: false
          prerelease: false
          files: jars/*.jar
