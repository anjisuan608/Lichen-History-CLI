plugins {
    alias(libs.plugins.shadow)
}

base {
    archivesName = 'historycli-sponge'
}

tasks.withType(JavaCompile).configureEach {
    // Sponge 平台（1.21.x）运行在 Java 21 上，common 也是 --release 21，
    // 保持一致才能被 shade 进同一个 jar；用 25 编译会在 Java 21 服务端直接
    // UnsupportedClassVersionError。
    options.release = 21
}

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    // 编译目标取**最低支持版本**（与本仓库 bukkit 版取 paper-api 最低版本同一原则）：
    // SpongeVanilla 的最新平台是 1.21.1 + API 12，SpongeForge 已到 API 17，
    // 编译到 12 才能同时跑在这三代上，也与 LuckPerms 的做法一致。
    compileOnly 'org.spongepowered:spongeapi:12.0.0'
    shade project(':common')
}

processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('META-INF/sponge_plugins.json') {
        expand 'pluginVersion': version
    }
    from(rootProject.file('lang'))
    from(rootProject.file('LICENSE'))
}

// 每个模块只产出 shadowJar 一个产物：普通 jar 与 shadowJar 默认文件名相同、会互相覆盖，
// 谁后执行谁赢，可能得到缺少 common 的空壳 jar，因此直接禁用普通 jar。
jar {
    enabled = false
}

shadowJar {
    configurations = [project.configurations.shade]
    archiveClassifier = ''
    dependencies {
        include(dependency('org.anjisuan608.historycli:.*'))
    }
}

build.dependsOn shadowJar
