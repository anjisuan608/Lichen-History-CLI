plugins {
    alias(libs.plugins.loom) apply false
    alias(libs.plugins.shadow) apply false
    alias(libs.plugins.moddevgradle) apply false
    alias(libs.plugins.forgegradle) apply false
}

def resolveVersion = {
    String gitRef = System.getenv('GITHUB_REF')
    String gitSha = System.getenv('GITHUB_SHA')
    String dynamic
    if (gitRef != null && gitRef.startsWith('refs/tags/')) {
        // tag 发版：取标签名并过滤前缀 v（如有），需为合法 semver
        String tag = gitRef.substring('refs/tags/'.length())
        dynamic = tag.replaceFirst(/^v(?=\d)/, '')
    } else if (gitSha != null && !gitSha.isEmpty()) {
        // GitHub Actions 构建：提交哈希前 7 位作为 semver pre-release
        dynamic = 'dev.' + gitSha.take(7)
    } else {
        // 本地构建：合法 semver 的 SNAPSHOT
        dynamic = 'SNAPSHOT'
    }
    // 版本号统一以 26- 开头
    return '26-' + dynamic
}

ext {
    fullVersion = resolveVersion()
    minecraftVersion = providers.gradleProperty('minecraft_version').get()
    modId = providers.gradleProperty('mod_id').get()
    modName = providers.gradleProperty('mod_name').get()
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    group = 'org.anjisuan608.historycli'
    version = rootProject.ext.fullVersion

    repositories {
        mavenCentral()
        maven { url = 'https://libraries.minecraft.net/' }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
