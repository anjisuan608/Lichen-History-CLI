org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.daemon=false
org.gradle.configuration-cache=false

# Minecraft / modding versions
minecraft_version=26.2
# 依赖范围与实际编译/测试的版本一致（之前是精确 [26.2]，且从未被任何 mods.toml 引用）
minecraft_version_range=[26.2,27)
# Fabric 的版本范围语法是 ">=X <Y"（不是 Maven 的 [X,Y)），单独给 fabric.mod.json 用
minecraft_version_range_fabric=>=26.1 <27
# Fabric 独立编译目标：取**最低支持版本**，编译器会当场拦住"用了 26.2 才有的方法"，
# loom 的 mixin 注解处理器也会拿这个名字表校验 mixin 目标（目标缺失会直接崩溃，必须编译期挡住）。
# 不能直接改 minecraft_version——它同时被 forge 用作构件坐标 net.minecraftforge:forge:<mc>-<fg>。
minecraft_version_fabric=26.1.2

# —— 加载器：构建版本 与 发布给用户的最低版本 分离（MDK 的 *_min 设计）——
# 构建版本：实际编译、运行 dev 实例所用的版本
fabric_loader_version=0.19.3
neo_version=26.2.0.88
forge_version=65.1.3
# 最低版本：写进 fabric.mod.json / neoforge.mods.toml / mods.toml，用户低于它会被拒载。
# 初始值 = 构建版本（我们只在这些版本上验证过）；日后在更老版本上实测通过再单独下调。
fabric_loader_version_min=0.19.3
neo_version_min=26.2.0.57
forge_version_min=65.0.0

# fabric-api 编译依赖跟着 Fabric 的最低编译目标（26.1.2）走；
# 我们只用三个长期稳定的 API：ModInitializer / CommandRegistrationCallback / ServerLifecycleEvents
fabric_api_version=0.155.3+26.1.2

# Project metadata
mod_id=lichenhistorycli
mod_name=Lichen History CLI
mod_license=LGPL-3.0-or-later
mod_group_id=org.anjisuan608.historycli
mod_authors=anjisuan608
mod_credits=luosangguichen
