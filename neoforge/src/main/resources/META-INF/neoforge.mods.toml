modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"

[[mixins]]
config = "lichenhistorycli.neoforge.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
description = "Bash-like history command management for Minecraft."
authors = "${mod_authors}"
credits = "${mod_credits}"
iconFile = "icon.png"
logoFile = "icon.png"

# 不声明依赖的话本 mod 会被加载到任意 Minecraft/NeoForge 版本上。
# 声明范围 = minecraft_version_range（MC 侧 [26.1,27)）+ neo_version_min（loader 侧取 26.1 线下限）；
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
# 下限用 neo_version_min（可独立于构建版本 neo_version 调整），
# 而不是构建版本本身——否则每升一次构建版本，老用户就被自动拒载。
versionRange = "[${neo_version_min},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
